name: Publish CRM update package
on:
  push:
    branches: [main]
    paths: ['updates/**', '.github/workflows/publish-update.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crm-release-publisher
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select newest release manifest
        shell: python
        run: |
          import json, os, re
          from pathlib import Path
          candidates=[]
          for path in Path('updates').glob('*/release.json'):
              meta=json.loads(path.read_text(encoding='utf-8'))
              version=str(meta.get('version',''))
              if not re.fullmatch(r'\d+\.\d+\.\d+(?:-test)?',version): raise RuntimeError('Invalid release version')
              nums=tuple(map(int,version.split('-')[0].split('.')))
              candidates.append((nums,version,path.parent))
          if not candidates: raise RuntimeError('No update manifests')
          _,version,directory=max(candidates)
          with open(os.environ['GITHUB_ENV'],'a') as out:
              out.write(f'VERSION={version}\nTAG=v{version}\nBUNDLE_DIR={directory.as_posix()}\n')
      - name: Skip already published version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "Release $TAG already exists"; exit 0; fi
      - name: Download or rebuild archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f "$BUNDLE_DIR/update.zip" ]]; then
            if [[ -f "$BUNDLE_DIR/update.zip.url" ]]; then
              curl --fail --location --retry 3 --retry-all-errors "$(cat "$BUNDLE_DIR/update.zip.url")" -o "$BUNDLE_DIR/update.zip"
            else
              shopt -s nullglob
              parts=("$BUNDLE_DIR"/update.zip.b64.part*)
              if [[ ${#parts[@]} -eq 0 ]]; then echo 'No archive source found' >&2; exit 1; fi
              cat "${parts[@]}" | base64 --decode > "$BUNDLE_DIR/update.zip"
            fi
          fi
      - name: Verify checksum and archive
        shell: python
        run: |
          import hashlib, json, os, zipfile
          from pathlib import Path
          directory=Path(os.environ['BUNDLE_DIR'])
          meta=json.loads((directory/'release.json').read_text(encoding='utf-8'))
          archive=(directory/'update.zip').read_bytes()
          assert hashlib.sha256(archive).hexdigest()==meta['sha256'], 'SHA-256 mismatch'
          with zipfile.ZipFile(directory/'update.zip') as z:
              assert z.testzip() is None, 'Corrupt ZIP archive'
              assert json.loads(z.read('update.json'))['version']==meta['version'], 'Version mismatch'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$VERSION" == *-test ]]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "$TAG" "$BUNDLE_DIR/update.zip" "$BUNDLE_DIR/release.json" "$BUNDLE_DIR/release.sig" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "CRM Kabei $VERSION" --notes-file "$BUNDLE_DIR/NOTES_FA.txt" "${flags[@]}"
