name: Remove superseded CRM updates
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-old-updates.yml']
permissions:
  contents: write
concurrency:
  group: crm-release-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify retained release and remove requested old releases
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.15.4 --repo "$GITHUB_REPOSITORY" --json tagName,assets > /tmp/retained-release.json
          python3 - <<'PY'
          import json
          release=json.load(open('/tmp/retained-release.json'))
          assert release['tagName']=='v0.15.4'
          assert {'update.zip','release.json','release.sig'} <= {a['name'] for a in release['assets']}
          PY
          for tag in v0.15.3-test v0.15.2-test; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
            fi
          done
      - name: Remove old package directories and this one-time workflow
        shell: python
        run: |
          import os, json, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          assert repo=='ahmadimahdi111-rgb/Crm-Updates'
          base='https://api.github.com/repos/'+repo
          def api(path, data=None, method=None):
              req=urllib.request.Request(base+path, data=json.dumps(data).encode() if data is not None else None,
                  headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method=method)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)
          branch=api('/branches/main')
          sha=branch['commit']['sha']; tree=branch['commit']['commit']['tree']['sha']
          entries=api('/git/trees/'+tree+'?recursive=1')['tree']
          old=('updates/v0.15.3-test/','updates/v0.15.2-test/')
          deletions=[{'path':e['path'],'mode':e['mode'],'type':'blob','sha':None} for e in entries if e['type']=='blob' and e['path'].startswith(old)]
          deletions.append({'path':'.github/workflows/cleanup-old-updates.yml','mode':'100644','type':'blob','sha':None})
          result=api('/git/trees',{'base_tree':tree,'tree':deletions})
          commit=api('/git/commits',{'message':'Remove superseded update packages; retain 0.15.4','tree':result['sha'],'parents':[sha]})
          api('/git/refs/heads/main',{'sha':commit['sha'],'force':False},'PATCH')
          print('Removed old update packages and one-time cleanup workflow; retained v0.15.4.')
